name: Publish manga archive

on:
  push:
    branches:
      - agent/manga-download-20260811

permissions:
  contents: write

concurrency:
  group: manga-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out assembly branch
        uses: actions/checkout@v4

      - name: Assemble and verify archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat chunks/manga.part-* > dist/manga_color_pages_01-20.zip
          expected="12053f6ec770b9eb2d64c3f2d083776b1eb8118e5f083d7644fe981770420dd5"
          actual="$(sha256sum dist/manga_color_pages_01-20.zip | cut -d' ' -f1)"
          test "$actual" = "$expected"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="manga-pages-01-20-20260811"
          asset="dist/manga_color_pages_01-20.zip#Color manga pages 01-20"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --target "${GITHUB_SHA}" \
              --title "Color manga pages 01-20" \
              --notes "20 full-resolution color manga pages in one ZIP archive."
          fi

      - name: Commit downloadable archive to assembly branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp dist/manga_color_pages_01-20.zip downloads/manga_color_pages_01-20.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/manga_color_pages_01-20.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish manga archive [skip ci]"
            git push
          fi
